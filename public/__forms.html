<!-- Netlify Forms skeleton for build-time detection (SSR/Nuxt) -->
<html>
  <body>
    <form name="adteko-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="adteko-contact" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>
  </body>
</html>
